<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Contor Bec</title>
    <script>
        var contor = 0;

        function comutaBec() {
            var bec = document.getElementById("imagineBec");
            var mesaj = document.getElementById("mesaj");

            if (bec.src.match("stins")) {
                bec.src = "Bec aprins.gif";
                contor++;
                mesaj.innerHTML = "Becul a fost aprins de " + contor + " ori.";
            } else {
                bec.src = "Bec stins.gif";
            }
        }
    </script>
</head>
<body>

    <h1>Bec cu Contor</h1>

    <p>
        <img id="imagineBec" 
             src="Bec stins.gif" 
             width="100" 
             height="180" 
             alt="Bec" 
             onclick="comutaBec()" 
             style="cursor: pointer;">
    </p>

    <p id="mesaj">Becul a fost aprins de 0 ori.</p>

</body>
</html>
