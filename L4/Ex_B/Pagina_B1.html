<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_B1</title>
<style>
    body {
        background-color: #ffffcc;
    }

    .center {
        text-align: center;
        color: white;
    }

    h1 {
        background-color: #00cc66;
        color: orange;
    }

    
    table, th, td {
        border-collapse: collapse;
    }


    #s1 table {
        background-color: #5c93e6; 
        border: 1px solid black;
    }

    #s1 th, 
    #s1 td {
        border: 1px solid black;
        padding: 6px;
    }

    
    table.centre {
        border: 5px solid blue;
        background-color: yellow; 
    }

    table.centre th,
    table.centre td {
        border: 5px solid blue;
        padding: 15px;         
        text-align: center;     
        color: blue;             
    }

    #s1 {
        background-color: #00cc66;
    }

    #s2 {
        background-color: yellow;
    }

    #s2 table {
        background-color: rgb(0, 225, 255);
    }

    div {
        color: blue;
    }
</style>
</head>
<body>

<h1 class="center">Tabele formatate</h1>

<div id="s1">
    <table style="width:100%" class="center">
      <tr>
        <th>First name</th>
        <th>Last name</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>Jill</td>
        <td>Smith</td>
        <td>50</td>
      </tr>
      <tr>
        <td>Eve</td>
        <td>Jackson</td>
        <td>94</td>
      </tr>
    </table>
    <br>
</div> 

<div id="s2" style="width:50%">
    <br>
    <table style="width:100%" class="centre">
      <tr>
        <th>Firstname</th>
        <th>Lastname</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>Jill</td>
        <td>Smith</td>
        <td>50</td>
      </tr>
      <tr>
        <td>Eve</td>
        <td>Jackson</td>
        <td>94</td>
      </tr>
    </table>
</div> 
</br>
<a href="../index.html">Pagina principala</a>
</body>
</html>
